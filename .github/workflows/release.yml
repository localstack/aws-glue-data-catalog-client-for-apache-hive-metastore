name: Build Hive

on:
  push:
    branches: [ branch-3.4.0-release ]
  pull_request:
    branches: [ branch-3.4.0-release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Clone Apache Hive Fork
      run: |
        git clone --branch branch-3.1.patch https://github.com/macnev2013/hive.git

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build Hive with Maven 3.1
      working-directory: hive
      run: mvn -B clean install -DskipTests

    - name: Build Hive with Maven 2.3
      working-directory: hive
      run: |
        git checkout branch-2.3.patch
        mvn -B clean install -DskipTest

    - name: Build Metastore with Maven
      run: mvn -B clean install -DskipTests
