name: Build Hive

on:
  push:
    branches: [ branch-3.4.0-release ]
  pull_request:
    branches: [ branch-3.4.0-release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Clone Apache Hive Fork
      run: |
        git clone --branch branch-3.1.patch https://github.com/macnev2013/hive.git

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Build Hive with Maven 3.1
      working-directory: hive
      run: mvn clean install -DskipTests

    - name: Build Hive with Maven 2.3
      working-directory: hive
      run: |
        git checkout branch-2.3.patch
        mvn clean install -DskipTests

    - name: Build Metastore with Maven
      run: |
        mvn clean install -DskipTests
    
    - name: Build AWS Glue Data Catalog Client
      run: |
        cd aws-glue-datacatalog-client-common
        mvn clean package -DskipTests

    - name: Build AWS Glue Data Catalog Hive3 Client
      run: |
        cd aws-glue-datacatalog-hive3-client
        mvn clean package -DskipTests

    - name: Build AWS Glue Data Catalog Spark Client
      run: |
        cd aws-glue-datacatalog-spark-client
        mvn clean package -DskipTests
    
    - name: List files
      run: |
        ls -l || echo "No target directory found"
        ls -l hive/target || echo "No target directory found"
        ls -l aws-glue-datacatalog-client-common/target || echo "No target directory found"
        ls -l aws-glue-datacatalog-hive3-client/target || echo "No target directory found"
        ls -l aws-glue-datacatalog-spark-client/target || echo "No target directory found"
        ls -l target || echo "No target directory found"