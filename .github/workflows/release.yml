name: Release

on:
  release:
    types: [created]
  push:
    branches:
      - release/3.4.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '3.4.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # Add steps to clone and patch Hive according to README.md
    - name: Clone Apache Hive
      run: git clone https://github.com/apache/hive.git

    - name: Apply Hive 3.1 patch
      run: |
        cd hive
        git checkout branch-3.1
        git apply -3 $GITHUB_WORKSPACE/branch_3.1.patch
        mvn clean install -DskipTests

    - name: Apply Hive 2.3 patch for Spark
      run: |
        cd hive
        git add .
        git reset --hard
        git checkout branch-2.3
        wget -O HIVE-12679.branch-2.3.patch https://issues.apache.org/jira/secure/attachment/12958418/HIVE-12679.branch-2.3.patch
        patch -p0 < HIVE-12679.branch-2.3.patch
        mvn clean install -DskipTests

    - name: Build with Maven
      run: mvn -B clean install -DskipTests

    - name: Run Tests
      run: mvn -B test

    - name: Set version from release
      if: github.event_name == 'release'
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Set version from input
      if: github.event_name == 'workflow_dispatch'
      run: echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
      
    - name: Set version from branch
      if: github.ref == 'refs/heads/release/3.4.0'
      run: echo "RELEASE_VERSION=3.4.0" >> $GITHUB_ENV

    - name: Build final artifacts
      run: |
        # Replace SNAPSHOT with release version if needed
        find . -name "pom.xml" -exec sed -i "s/-SNAPSHOT//" {} \;
        mvn -B clean package -DskipTests
      
    - name: Upload Common Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aws-glue-datacatalog-client-common
        path: aws-glue-datacatalog-client-common/target/aws-glue-datacatalog-client-common-*.jar

    - name: Upload Spark Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aws-glue-datacatalog-spark-client
        path: aws-glue-datacatalog-spark-client/target/aws-glue-datacatalog-spark-client-*.jar

    - name: Upload Hive3 Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aws-glue-datacatalog-hive3-client
        path: aws-glue-datacatalog-hive3-client/target/aws-glue-datacatalog-hive3-client-*.jar

    - name: Upload Shims Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shims
        path: |
          shims/common/target/*.jar
          shims/hive3-shims/target/*.jar
          shims/loader/target/*.jar
          shims/spark-hive-shims/target/*.jar

    - name: Attach Artifacts to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          aws-glue-datacatalog-client-common/target/aws-glue-datacatalog-client-common-*.jar
          aws-glue-datacatalog-spark-client/target/aws-glue-datacatalog-spark-client-*.jar
          aws-glue-datacatalog-hive3-client/target/aws-glue-datacatalog-hive3-client-*.jar
          shims/common/target/*.jar
          shims/hive3-shims/target/*.jar
          shims/loader/target/*.jar
          shims/spark-hive-shims/target/*.jar